<script>
"use strict";
/* ===== config ===== */
const API="https://fnjyxwzbcxganphzydli.supabase.co/functions/v1/iqpay";
const MODE=window.IQ_MODE==="admin"?"admin":"shop"; /* index.html = shop, admin.html = admin panel */

/* ===== helpers ===== */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(+n||0).toLocaleString("en-US");
const when=t=>{if(!t)return"";const d=new Date(t);return d.toLocaleDateString("en-GB")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const store={get(k,s){try{return(s?sessionStorage:localStorage).getItem(k)}catch(e){return null}},set(k,v,s){try{(s?sessionStorage:localStorage).setItem(k,v)}catch(e){}},del(k,s){try{(s?sessionStorage:localStorage).removeItem(k)}catch(e){}}};
async function api(action,data={}){
 let r;try{r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,...data})})}catch(e){throw new Error("پەیوەندی بە ئینتەرنێتەوە نییە")}
 const j=await r.json().catch(()=>({error:"هەڵەیەک ڕوویدا"}));
 if(!r.ok){if(r.status===401&&action.startsWith("a_")&&action!=="a_change_password"){A.session=null;store.del("iq_admin");close();S.screen="alogin";render()}throw new Error(j.error||"هەڵەیەک ڕوویدا")}
 return j;
}
const device=()=>{const u=navigator.userAgent;return /iPhone|iPad/.test(u)?"iPhone":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac/.test(u)?"Mac":"other"};
/* shrink photos before upload (keeps receipts readable, makes uploads fast) */
function shrink(file,max=1600,q=.85){return new Promise((res,rej)=>{
 if(!/^image\//.test(file.type))return rej(new Error("تەنها وێنە"));
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q))};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("ئەم وێنەیە ناخوێندرێتەوە"))};img.src=url})}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const layer=document.getElementById("layer"),app=document.getElementById("app");
function sheet(h){layer.innerHTML=`<div class="sheetbg" data-close><div class="sheet" dir="rtl">${h}</div></div>`}
const close=()=>layer.innerHTML="";
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("کۆپی کرا ✅")).catch(()=>{sheet(`<h4>کۆپیکردن</h4><textarea id="cpy" rows="3" dir="ltr" style="width:100%">${esc(t)}</textarea><button class="ghost" data-cancel>داخستن</button>`);const x=document.getElementById("cpy");x.focus();x.select()})}
async function busy(btn,fn){if(btn)btn.classList.add("busy");try{return await fn()}catch(e){toast(e.message)}finally{if(btn)btn.classList.remove("busy")}}

const ic={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>',
 bag:'<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>',
 help:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>',
 card:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
 lock:'<svg viewBox="0 0 24 24" width="14" style="stroke:currentColor;fill:none;stroke-width:2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" style="width:20px;stroke:var(--ink);fill:none;stroke-width:2"><path d="M9 6l6 6-6 6"/></svg>'
};
const mark=`<svg class="lm" viewBox="22 14 146 122" aria-hidden="true"><g transform="rotate(-14 95 75)"><rect x="38" y="30" width="120" height="76" rx="12" fill="#118a85"/></g><g transform="rotate(-4 95 80)"><rect x="32" y="44" width="126" height="80" rx="12" fill="#f2a516"/><rect x="46" y="60" width="22" height="16" rx="4" fill="#0f1f22" opacity=".22"/><text x="144" y="110" text-anchor="end" font-family="JetBrains Mono,monospace" font-weight="800" font-size="34" fill="#0f1f22">IQ</text></g></svg>`;
const logo=`<div class="logo">${mark}<span class="lw">IQ PAY</span></div>`;
const back=(attr,val="")=>`<button class="iconbtn" ${attr}="${val}" aria-label="گەڕانەوە">${ic.arrow}</button>`;
const empty=t=>`<div class="list"><div class="row"><div class="mid"><small>${t}</small></div></div></div>`;
const gstyle=p=>`--c1:${esc(p.col1)};--c2:${esc(p.col2)}`;
function cardFace(p,val){
 if(p.img_url)return `<span class="gcard imgcard" style="${gstyle(p)}"><img src="${esc(p.img_url)}" alt="${esc(p.name)}">${val?`<span class="gbig onimg">${esc(val)}</span>`:""}</span>`;
 return `<span class="gcard" style="${gstyle(p)}"><span class="gtop"><span class="gbig">${esc(val||"")}</span><span class="gmono">${esc(p.mono)}</span></span><span class="chip"></span><span class="gbot"><span class="gname">${esc(p.name)}</span><span class="gtype">GIFT CARD</span></span></span>`;
}
const STT={pending:"چاوەڕێی پشکنین",done:"کۆد نێردرا",rejected:"ڕەتکرایەوە"};
const stPill=s=>`<span class="st ${s}">${STT[s]||esc(s)}</span>`;
const CATS=[["stream","ئەپ و ستریم"],["game","یاری"],["mobile","کارتی مۆبایل"],["net","ئینتەرنێت"]];

/* ===== state ===== */
const S={screen:"loading",tab:"home",cat:null,mine:[],prod:null,den:null,qty:1,pay:null,shot:null,order:null,err:null,chat:null,chatUnread:0,cimg:null};
const C={token:null,vid:null};
const A={session:store.get("iq_admin"),tab:"orders",of:"pending",orders:[],stats:null,prods:[],visits:null,pays:[],draft:null,mustChange:false,threads:null,thread:null,threadId:null,cimg:null};
const ADMIN_TABS=["orders","chats","prods","visits","settings"];
const pName=o=>o.product_name;

/* ===== customer screens ===== */
function home(){
 const ready=S.mine.filter(o=>o.status==="done"&&!o.seen).length,P=S.cat.products,pays=S.cat.pays;
 return `<div class="top">${logo}<button class="sbtn" data-go="help" style="background:var(--soft);color:var(--ink)">💬 پشتگیری</button></div>
 <div class="balance shophero">
  <div class="herobody"><div class="kicker">کارتی دیجیتاڵ</div>
  <h1>کۆدی کارتەکەت،<br>لە چەند خولەکێکدا</h1>
  <p>بێ هەژمار و بێ وشەی نهێنی. کارت هەڵبژێرە، پارە بنێرە، کۆدەکەت لێرە وەردەگریت.</p></div>
  <div class="herocards" aria-hidden="true">${P.slice(0,2).map((p,i)=>`<span class="hc hc${i}">${cardFace(p,p.denoms[Math.min(4,p.denoms.length-1)]?.label||"")}</span>`).join("")||`<span class="hc hc0">${mark}</span>`}</div>
  <div class="trust"><span>⚡ خێرا</span><span>🔒 پارێزراو</span><span>💬 پشتگیری ڕاستەوخۆ</span></div>
 </div>
 ${ready?`<button class="notice" data-go="orders" style="margin-top:14px;width:100%;text-align:start;border-color:var(--ok)">🎉 ${ready} کۆدی نوێت ئامادەیە، بیبینە ←</button>`:""}
 <div class="sec"><h3>کارتەکان</h3>
 <div class="cards">${P.map(p=>`<button class="dtile" data-prod="${esc(p.id)}" aria-label="${esc(p.name)}">${cardFace(p,"")}<span class="dname">${esc(p.name)}</span></button>`).join("")||'<p class="note">بەم زووانە کارت زیاد دەکرێت</p>'}</div></div>
 ${pays.length?`<div class="sec"><h3>شێوازەکانی پارەدان</h3><div class="pays">${pays.map(x=>`<div class="pay"><i style="background:${esc(x.color)}">${esc(x.mono)}</i>${esc(x.name)}</div>`).join("")}</div></div>`:""}`;
}
function prod(){
 const p=S.cat.products.find(x=>x.id===S.prod);if(!p){S.screen="home";return home()}
 const d=p.denoms[S.den],tot=d?d.price*S.qty:0;
 return `<div class="top">${back("data-go","home")}<div class="title" style="flex:1">${esc(p.name)}</div></div>
 <p class="hint">کارتێک هەڵبژێرە · کۆدەکە دوای پشکنینی پارەدانەکە دەنێردرێت</p>
 <div class="cards">${p.denoms.map((x,i)=>`<button class="dtile ${S.den===i?"on":""}" data-den="${i}" aria-label="${esc(p.name)} ${esc(x.label)}">${cardFace(p,x.label)}<span class="dname">${fmt(x.price)} IQD</span></button>`).join("")}</div>
 <div class="qty"><span>ژمارە</span><div class="ctl"><button data-q="-1" aria-label="کەمکردنەوە">−</button><span>${S.qty}</span><button data-q="1" aria-label="زیادکردن">+</button></div></div>
 <div class="kv" style="margin-top:14px;border:0"><span>کۆی گشتی</span><b>${fmt(tot)} IQD</b></div>
 <button class="cta" data-checkout ${d?"":"disabled"}>بەردەوامبوون بۆ پارەدان</button>`;
}
function checkout(){
 const p=S.cat.products.find(x=>x.id===S.prod),d=p.denoms[S.den],tot=d.price*S.qty,pays=S.cat.pays,m=pays.find(x=>x.id===S.pay);
 if(!pays.length)return `<div class="top">${back("data-go","prod")}<div class="title" style="flex:1">پارەدان</div></div><div class="notice bad">ئێستا هیچ شێوازێکی پارەدان بەردەست نییە. تکایە دواتر هەوڵ بدەرەوە یان لە بەشی «پشتگیری» نامەمان بۆ بنێرە.</div><button class="cta" data-go="help">نامە ناردن بۆ پشتگیری</button>`;
 return `<div class="top">${back("data-go","prod")}<div class="title" style="flex:1">پارەدان</div></div>
 <div class="sumcard">${cardFace(p,d.label)}<div class="mid"><b>${esc(p.name)} ${esc(d.label)}${S.qty>1?" × "+S.qty:""}</b><br><span class="oid" style="font-size:18px">${fmt(tot)} IQD</span></div></div>

function chatList(msgs,adminView){

let lastChatLen=-1;
function scrollChat(force){const n=(S.screen==="help"?S.chat:A.thread?.messages)?.length??0;if(force||n!==lastChatLen){lastChatLen=n;requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}}
/* refresh only the message list, so a half-typed message is never lost */
function paintChat(){const el=document.getElementById("chatlist");if(!el)return;el.innerHTML=S.screen==="help"?chatList(S.chat,false):chatList(A.thread?.messages,true);scrollChat()}
function go(s){S.screen=s;if(["home","orders","help"].includes(s))S.tab=s;window.scrollTo(0,0);render()}

/* ===== data loading ===== */
async function loadMine(){const r=await api("my_orders",{token:C.token});S.mine=r.orders;S.chatUnread=r.chatUnread||0}
async function loadChat(){const r=await api("chat_list",{token:C.token});S.chat=r.messages;S.chatUnread=0}
async function boot(){
 try{
  if(MODE==="admin"){
   if(A.session){A.tab="orders";await openAdmin()}else{S.screen="alogin";render();setTimeout(()=>document.getElementById("apw")?.focus(),50)}
   return}
  const h=await api("hello",{token:store.get("iq_token"),device:device()});C.token=h.token;C.vid=h.vid;store.set("iq_token",h.token);
  const [cat]=await Promise.all([api("catalog"),loadMine()]);S.cat=cat;
  S.screen=location.hash==="#support"?"help":"home";S.tab=S.screen;render();
  if(S.screen==="help")loadChat().then(paintChat).catch(()=>{});
 }catch(e){S.err=e.message;S.screen="error";render()}
}
/* customer: refresh orders (and unread support replies) every 20s, so codes appear by themselves */
setInterval(async()=>{
 if(MODE!=="shop"||document.hidden||!C.token)return;
 try{const before=S.mine.filter(o=>o.status==="done").length,cu=S.chatUnread;await loadMine();
  if(S.mine.filter(o=>o.status==="done").length>before)toast("🎉 کۆدەکەت گەیشت");
  if(S.chatUnread>cu&&S.screen!=="help")toast("💬 وەڵامێکی نوێ لە پشتگیری");
  if(["home","orders","order"].includes(S.screen)&&!layer.innerHTML)render();
  else if(S.screen==="help"){} }catch(e){}
},20000);
/* customer chat open: check for replies every 6s */
setInterval(async()=>{if(MODE!=="shop"||document.hidden||S.screen!=="help")return;try{await loadChat();paintChat()}catch(e){}},6000);
/* admin: refresh the open tab every 20s, the open conversation every 6s */
setInterval(async()=>{if(MODE!=="admin"||document.hidden||S.screen!=="admin"||!A.session)return;try{await loadAdminTab(true)}catch(e){}},20000);
setInterval(async()=>{if(MODE!=="admin"||document.hidden||S.screen!=="athread"||!A.session)return;try{await loadThread();paintChat()}catch(e){}},6000);

async function loadThread(){A.thread=await api("a_thread",{session:A.session,visitor_id:A.threadId})}
async function loadAdminTab(quiet){
 const ss=api("a_stats",{session:A.session});
 if(!A.pays.length)A.pays=(await api("a_pays",{session:A.session})).pays;
 if(A.tab==="orders"){const [s,o]=await Promise.all([ss,api("a_orders",{session:A.session,status:A.of})]);
  const newOnes=A.stats&&s.pending>A.stats.pending;A.stats=s;A.orders=o.orders;if(newOnes)toast("📥 داواکارییەکی نوێ هات")}
 else{const s=await ss;if(A.stats&&s.pending>A.stats.pending)toast("📥 داواکارییەکی نوێ هات");if(A.stats&&s.chats>A.stats.chats)toast("💬 نامەیەکی نوێ لە کڕیارێک");A.stats=s}
 if(A.tab==="chats")A.threads=(await api("a_threads",{session:A.session})).threads;
 if(A.tab==="prods")A.prods=(await api("a_products",{session:A.session})).products;
 if(A.tab==="visits")A.visits=await api("a_visitors",{session:A.session});
 if(A.tab==="settings")A.pays=(await api("a_pays",{session:A.session})).pays;
 if(S.screen==="admin"&&(!quiet||!layer.innerHTML))render();
}
async function openAdmin(){S.screen="admin";render();try{await loadAdminTab()}catch(e){toast(e.message)}}
async function sendChat(btn){
 const ta=document.getElementById("cmsg"),body=(ta?.value||"").trim(),adm=S.screen==="athread",image=adm?A.cimg:S.cimg;
 if(!body&&!image){ta?.focus();return}
 await busy(btn,async()=>{
  if(adm){await api("a_chat_send",{session:A.session,visitor_id:A.threadId,body,image});A.cimg=null;ta.value="";await loadThread()}
  else{await api("chat_send",{token:C.token,body,image});S.cimg=null;ta.value="";await loadChat()}
  render();scrollChat(true);document.getElementById("cmsg")?.focus()});
}
async function refreshCatalog(){try{S.cat=await api("catalog")}catch(e){}}

/* ===== order sheet (admin) ===== */
async function orderSheet(id){
 sheet('<div class="spin"></div>');
 try{
  const {order:o,receipt,stock}=await api("a_order",{session:A.session,id});
  sheet(`<h4>داواکاری <span class="oid">#${o.id}</span> ${stPill(o.status)}</h4>
  ${receipt?`<a href="${esc(receipt)}" target="_blank" rel="noopener"><img class="shotimg" src="${esc(receipt)}" alt="سکرینشۆتی پارەدان"></a><p class="mini center">بۆ گەورەکردن وێنەکە دابگرە</p>`:'<p class="notice bad">وێنەکە نەدۆزرایەوە</p>'}
  <div style="margin-top:10px">
   <div class="kv"><span>کارت</span><span>${esc(o.product_name)} ${esc(o.denom_label)}${o.qty>1?" × "+o.qty:""}</span></div>
   <div class="kv"><span>دەبێت بگات</span><b>${fmt(o.total)} IQD</b></div>
   <div class="kv"><span>پارەدان</span><span>${esc(PAYN(o.pay_method))} → <span class="oid">${esc(o.pay_account)}</span></span></div>
   <div class="kv"><span>کڕیار</span><span><span class="oid">${esc(o.visitors?.vid)}</span> · ${esc(o.visitors?.device)}${o.phone?` · <span class="oid">${esc(o.phone)}</span>`:""}</span></div>
   <div class="kv"><span>کات</span><span>${when(o.created_at)}</span></div></div>
  ${o.status==="pending"?`
   ${stock>=o.qty?`<button class="cta" data-sendstock="${o.id}">پارە گەیشت، کۆد لە کۆگا بنێرە (${stock} ئامادەیە)</button><p class="mini center" style="margin-top:8px">یان کۆد بە دەست بنووسە:</p>`:""}
   <label class="field"><span>کۆد (${o.qty} کۆد، هەر یەکە لە دێڕێک)</span><textarea id="sendcodes" rows="${Math.max(2,o.qty)}" dir="ltr" placeholder="XXXX-XXXX-XXXX"></textarea></label>
   <button class="${stock>=o.qty?"ghost":"cta"}" data-sendcode="${o.id}">پارە گەیشت، ئەم کۆدە بنێرە</button>
   <button class="ghost" data-rejectorder="${o.id}" style="color:var(--bad)">ڕەتکردنەوە</button>`
  :o.status==="done"?`<div class="field"><span>کۆدی نێردراو · ${when(o.sent_at)}</span>${o.codes.map(c=>`<div class="code">${esc(c)}</div>`).join("")}</div><button class="ghost" data-cancel>داخستن</button>`
  :`<p class="notice bad">هۆکار: ${esc(o.reason)}</p><button class="ghost" data-cancel>داخستن</button>`}`);
 }catch(e){close();toast(e.message)}
}
async function codesSheet(i){
 const d=A.draft.denoms[i];sheet('<div class="spin"></div>');

  <button class="cta" data-codesave="${i}">زیادکردن</button>${codes.length?`<button class="ghost" data-codeclear="${i}" style="color:var(--bad)">سڕینەوەی هەموو</button>`:""}<button class="ghost" data-cancel>داخستن</button>`);
 }catch(e){close();toast(e.message)}
}

  if(d.go==="help")loadChat().then(()=>{render();scrollChat(true)}).catch(x=>toast(x.message));return}

 if(d.thread){A.threadId=+d.thread;A.thread=null;A.cimg=null;S.screen="athread";render();busy(null,async()=>{await loadThread();render();scrollChat(true)});return}
 if(d.themeToggle!==undefined){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dk?"light":"dark";return}

  const p=S.cat.products.find(x=>x.id===S.prod),dn=p.denoms[S.den];
  await busy(el,async()=>{
   const r=await api("place",{token:C.token,denom_id:dn.id,qty:S.qty,pay:S.pay,phone:wa,receipt:S.shot});
   await loadMine();S.shot=null;S.order=r.id;S.tab="orders";toast("داواکارییەکەت نێردرا ✅");go("order")});return}

 if(d.pnew!==undefined){A.draft={id:null,name:"",sub:"",cat:"game",mono:"",col1:"#24364a",col2:"#4f7cb5",active:true,img_url:null,denoms:[{id:null,label:"",price:0,stock:0}]};go("aprod");setTimeout(()=>document.getElementById("pn")?.focus(),50);return}
 if(d.dadd!==undefined){readDraft();A.draft.denoms.push({id:null,label:"",price:0,stock:0});render();return}
 if(d.ddel){readDraft();const i=+d.ddel,dn=A.draft.denoms[i];
  if(dn.stock){sheet(`<h4>سڕینەوەی ${esc(dn.label)}؟</h4><p class="hint">${dn.stock} کۆدی ئامادەی هەیە، کاتێک پاشەکەوت دەکەیت دەسڕێنەوە.</p><button class="cta" data-ddelok="${i}" style="background:var(--bad);color:#fff">بەڵێ</button><button class="ghost" data-cancel>نەخێر</button>`);return}
  A.draft.denoms.splice(i,1);render();return}
 if(d.ddelok){A.draft.denoms.splice(+d.ddelok,1);close();render();return}
 if(d.dnoimg!==undefined){readDraft();await busy(null,async()=>{await api("a_product_image",{session:A.session,id:A.draft.id,remove:true});A.draft.img_url=null;render()});return}
 if(d.codes){readDraft();codesSheet(+d.codes);return}
 if(d.codesave){const i=+d.codesave,lines=document.getElementById("codein").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast("کۆدێک بنووسە");return}
  await busy(el,async()=>{const before=A.draft.denoms[i].stock,r=await api("a_codes",{session:A.session,denom_id:A.draft.denoms[i].id,add:lines});A.draft.denoms[i].stock=r.codes.length;close();
   toast(`${r.codes.length-before} کۆد زیادکرا${lines.length>r.codes.length-before?" (دووبارەکان لابران)":""}`);render()});return}
 if(d.codeclear){const i=+d.codeclear;await busy(el,async()=>{await api("a_codes",{session:A.session,denom_id:A.draft.denoms[i].id,clear:true});A.draft.denoms[i].stock=0;close();render()});return}
 if(d.psave!==undefined){readDraft();const p=A.draft;
  if(!p.name){toast("ناوی کارت بنووسە");return}
  await busy(el,async()=>{const r=await api("a_save_product",{session:A.session,product:p,denoms:p.denoms});toast("پاشەکەوت کرا ✅");
   A.prods=(await api("a_products",{session:A.session})).products;
   if(!p.id){A.draft=JSON.parse(JSON.stringify(A.prods.find(x=>x.id===r.id)));render();toast("ئێستا دەتوانیت وێنە و کۆد زیاد بکەیت")}
   else{A.tab="prods";S.screen="admin";render()}});return}
 if(d.pdel!==undefined){sheet(`<h4>سڕینەوەی ${esc(A.draft.name)}؟</h4><p class="hint">هەموو نرخ و کۆدە ئامادەکانی دەسڕێنەوە. داواکارییە کۆنەکان دەمێننەوە.</p><button class="cta" data-pdelok style="background:var(--bad);color:#fff">بەڵێ، بیسڕەوە</button><button class="ghost" data-cancel>نەخێر</button>`);return}
 if(d.pdelok!==undefined){await busy(el,async()=>{await api("a_delete_product",{session:A.session,id:A.draft.id});close();toast("سڕایەوە");A.tab="prods";S.screen="admin";await loadAdminTab()});return}
});
document.addEventListener("change",async e=>{
 const f=e.target.files&&e.target.files[0];
 if(e.target.id==="shotin"&&f){try{S.shot=await shrink(f);render()}catch(x){toast(x.message)}return}
 if(e.target.id==="cimgin"&&f){try{const img=await shrink(f,1400,.85);if(S.screen==="athread")A.cimg=img;else S.cimg=img;render();scrollChat(true)}catch(x){toast(x.message)}return}
 if(e.target.id==="dimg"&&f){readDraft();await busy(null,async()=>{const img=await shrink(f,1000,.88);const r=await api("a_product_image",{session:A.session,id:A.draft.id,image:img});A.draft.img_url=r.url;render();toast("وێنەکە دانرا")});return}
 if(S.screen==="aprod"&&["pc1","pc2","pm","pn"].includes(e.target.id)){readDraft();render()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&document.activeElement?.id==="apw")document.querySelector("[data-adminin]")?.click();
 if(e.key==="Enter"&&!e.shiftKey&&document.activeElement?.id==="cmsg"&&!/Android|iPhone|iPad/.test(navigator.userAgent)){e.preventDefault();document.querySelector("[data-csend]")?.click()}});
document.addEventListener("input",e=>{if(e.target.id==="cmsg"){e.target.style.height="auto";e.target.style.height=Math.min(120,e.target.scrollHeight)+"px"}});
boot();
</script>
</body>
</html>
